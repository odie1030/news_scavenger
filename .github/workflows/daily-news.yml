name: Daily News Collection

on:
  schedule:
    # Run at 11:00 AM KST (02:00 UTC) every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  collect-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Set timezone to KST
        run: |
          sudo timedatectl set-timezone Asia/Seoul

      - name: Collect news and generate files
        run: |
          uv run news-scavenger --output-dir latest_news --hours 24 --top-n 10

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_news/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "Daily news update: ${DATE}"
            git push
          fi

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "[${{ job.status }}] ${{ github.workflow }} - ${{ github.repository }}"
          body: |
            Workflow: ${{ github.workflow }}
            Status:   ${{ job.status }}
            Branch:   ${{ github.ref_name }}
            Commit:   ${{ github.sha }}
            Run URL:  ${{ github.server_url }}/${{ github.repository }}/actions/run/${{ github.run_id }}
