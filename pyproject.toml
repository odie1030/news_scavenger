[project]
name = "news-scavenger"
version = "0.1.0"
description = "Daily AI & Game news trend collection system"
readme = "README.md"
authors = [
    { name = "odie1030", email = "redian0419@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "feedparser>=6.0.12",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
]

[project.scripts]
news-scavenger = "news_scavenger.main:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
